<!doctype html>
<!--
  No hard-coded `data-theme`: the default is "system" (the token stylesheet's
  prefers-color-scheme rules apply). The inline script below applies the user's
  persisted CHOICE before first paint to avoid a flash; `shell/theme.tsx` owns it
  from there. Fonts are loaded here so the `--font-*` tokens resolve to webfonts;
  swap the token + this <link> to re-type the whole app.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyric Studio</title>
    <script>
      // Pre-paint theme: mirror the persisted choice onto <html data-theme>.
      // "system" (or no choice) leaves the attribute off so the OS pref drives.
      try {
        var c = localStorage.getItem('pyric-studio:theme');
        if (c === 'light' || c === 'dark')
          document.documentElement.setAttribute('data-theme', c);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
