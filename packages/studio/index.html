<!doctype html>
<!--
  Studio is dark-only for V1.
  Fonts are loaded here so the `--font-*` tokens resolve to webfonts; swap the
  token + this <link> to re-type the whole app.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/pyric-logo.svg" />
    <title>Pyric Studio</title>
    <script>
      // Pre-paint theme: force the V1 dark palette and clear older overrides.
      try {
        localStorage.setItem('pyric-studio:theme', 'dark');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
