<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Phase 2 identity checkpoint</title>
<style>
body { font: 16px system-ui; max-width: 850px; margin: 32px auto; padding: 0 20px; color: #18202b; }
button, select { font: inherit; padding: 8px 12px; margin: 4px; }
pre { background: #f0f3f7; padding: 16px; white-space: pre-wrap; }
output { display: block; padding: 10px 0; }
</style>
<h1>Phase 2 identity checkpoint</h1>
<p>This page starts signed out. Use a different account in each window.</p>
<p>Runtime: <strong id="runtime">Starting</strong></p>
<div>
<button id="blue">Sign in blue editor</button>
<button id="red">Sign in red viewer</button>
<button id="signout">Sign out</button>
</div>
<label>Next sign-in tenant <select id="tenant"><option value="blue">blue</option><option value="red">red</option></select></label>
<button id="refresh">Refresh token</button>
<pre id="identity">Starting</pre>
<div>
<button id="write-blue">Write blue document</button>
<button id="write-red">Write red document</button>
<button id="listen">Listen to my document</button>
</div>
<output id="result" aria-live="polite">Ready</output>
<p>Listener updates: <strong id="updates">0</strong></p>
<pre id="document">No listener</pre>
<script>
const forcesInpage = new URL(location.href).searchParams.get('runtime') === 'inpage';
if (forcesInpage) globalThis.__PYRIC_FORCE_INPAGE__ = true;
</script>
<script type="module" src="/main.js"></script>
</html>
