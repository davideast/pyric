<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Phase 3 checkpoint</title>
<style>
body { font: 16px system-ui; max-width: 900px; margin: 32px auto; padding: 0 20px; }
button { font: inherit; margin: 4px; padding: 8px; }
pre { background: #eee; padding: 12px; }
output { display: block; margin: 12px 0; }
</style>
<h1>Phase 3 checkpoint</h1>
<p>Two named Firebase apps share data and retain separate connections.</p>
<p>Runtime: <strong id="runtime">Starting</strong></p>
<h2>RTDB disconnect</h2>
<p>Owner connected: <strong id="connected"></strong>; observer connected: <strong id="observer-connected"></strong></p>
<button id="arm">Arm disconnect</button>
<button id="cancel-child">Cancel untouched child</button>
<button id="cancel">Cancel disconnect</button>
<button id="offline">Owner offline</button>
<button id="online">Owner online</button>
<button id="returned">Observer writes returned</button>
<button id="delete">Delete owner</button>
<output id="result">Starting</output>
<pre id="presence"></pre>
<script>
const forcesInpage = new URL(location.href).searchParams.get('runtime') === 'inpage';
if (forcesInpage) globalThis.__PYRIC_FORCE_INPAGE__ = true;
</script>
<script type="module" src="/main.js"></script>
</html>
