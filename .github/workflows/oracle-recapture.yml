# Oracle re-capture lane — weekly production drift detection.
#
# Nothing else in CI re-consults production: build.yml only checks committed
# observations against the offline model and the version guard, so a `conforms`
# claim can silently outlive the behavior it was captured against. This lane
# re-runs the schedulable capture rigs against live Firebase, overwriting the
# observation files in place, then reports any change to the observations tree
# as drift — the same "the diff is the drift report" mechanism a human uses
# locally (see packages/conformance/docs/how-to-run-the-conformance-system.md).
# The comparison ignores the per-run `observedAt` timestamp every capture
# stamps, so it fires only on a real change to a captured fact.
#
# Two tiers of rig run here (the guide's rig fleet section is the map):
#   1. unattended — admin-app + app-registry: pure in-process probes of the
#      installed firebase / firebase-admin packages. No secret, no network;
#      they always run.
#   2. credentialed — oracle-run, messaging-send, rules-firestore,
#      rules-storage: each reaches a real Firebase project and needs a
#      provisioned credential. oracle-run and messaging-send gate on their
#      secrets; the two rules legs authenticate through Workload Identity
#      Federation and gate on the GCP_WIF_PROVIDER repository variable.
#      A leg whose `disabled` field names a blocking issue skips with that
#      reason. Any other leg whose guard is absent fails on a scheduled run,
#      so the weekly check never goes green with nothing checked against
#      production. On a manual dispatch it skips with a warning instead.
#
# Every leg ends by recording its state (checked with no drift, checked with
# drift, capture failed, or not run with the reason) as a summary line and the
# artifact oracle-leg-<rig>-<attempt>. The report job reads the latest attempt
# of each, writes a headline and a table of every leg to the run summary, and
# counts a leg whose record never arrived as not run. A disabled leg leaves the
# run green but is listed as not run. On a scheduled run, or a dispatch with file-issue set, the report
# also opens or updates one lane:reliability issue and comments the table, and
# closes it once every leg has checked production with no drift
# (scripts/ci/oracle-leg-report.ts).
#
# Deliberately excluded:
#   - rtdb-rules      — the one rig that MUTATES a live project (deploys a
#                       ruleset, then restores). Its deploy/capture/restore/
#                       read-back invariant is a human-witnessed correctness
#                       contract; it is not run unattended here.
#   - messaging-web   — human-witnessed, headed Chromium with a persistent
#                       profile. Cannot run on a CI worker by nature.
#   - ai-logic        — credentialed, but every run consumes paid model quota
#                       and it sits outside this lane's scoped rig set. It can
#                       be added as another credentialed matrix leg (guard
#                       PYRIC_AI_FIREBASE_CONFIG) when that trade is accepted.
#
# SAFETY: this lane never commits or pushes a changed observation. On drift it
# fails loudly with the diff in the job summary and uploads the rewritten
# observation files as a workflow artifact, kept 14 days; a human reviews the
# affected rows and commits them deliberately on a branch. Only the report job
# can write to issues. The lane never runs on pull requests.

name: Oracle re-capture

on:
  schedule:
    # Weekly, Monday 06:00 UTC — off-peak and clear of the daily build (09:17)
    # and playground (10:43) crons.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      file-issue:
        description: Open or update the lane:reliability issue, as a scheduled run does
        type: boolean
        default: false

# Read-only: drift surfaces as a red run with the diff in the summary. The lane
# writes nothing back to the repository. The report job adds issues: write.
permissions:
  contents: read

concurrency:
  # One re-capture at a time. A later run queues behind the in-flight one: a
  # capture deploys temporary rules and must finish its restore step.
  group: oracle-recapture
  cancel-in-progress: false

jobs:
  unattended:
    name: Unattended rigs (installed-SDK probes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Re-capture admin-app observations
        # In-process probes of the installed firebase-admin app registry.
        # --write overwrites the admin-app-* observation files in place so the
        # drift step can diff them (verify mode, the default, would not rewrite).
        run: bun run packages/conformance/src/admin-app-probes.ts --write
      - name: Re-capture app-registry observations
        # In-process probes of the installed firebase/app client registry.
        run: bun run packages/conformance/src/app-registry-probes.ts --write
      - name: Detect observation drift
        id: drift
        run: bun scripts/ci/oracle-drift-report.ts "unattended rigs (admin-app, app-registry)"
      # The diff above names the drifted files; these steps keep the
      # rewritten files themselves, so a person can review and commit them.
      # Timestamp-only rewrites come along too and are harmless to commit.
      - name: Collect rewritten observations
        if: failure() && steps.drift.outcome == 'failure'
        run: |
          dest="$RUNNER_TEMP/observation-drift"
          mkdir -p "$dest"
          git ls-files --modified --others --exclude-standard -z -- packages/conformance/observations |
            while IFS= read -r -d '' path; do
              if [ -f "$path" ]; then cp --parents "$path" "$dest"; fi
            done
      - name: Upload rewritten observations
        if: failure() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: observation-drift-unattended
          path: ${{ runner.temp }}/observation-drift
          retention-days: 14
          if-no-files-found: warn
      - name: Record this leg's state
        if: always()
        env:
          RIG: unattended
          AVAILABLE: 'true'
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          DRIFT_FOUND: ${{ steps.drift.outputs.found }}
          STATUS_DIR: ${{ runner.temp }}/oracle-leg
        run: bun scripts/ci/oracle-leg-report.ts record
      - name: Upload this leg's state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-leg-unattended-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-leg
          retention-days: 14
          if-no-files-found: warn

  credentialed:
    name: Credentialed rig (${{ matrix.rig }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One rig's drift or absent secret must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # `disabled` names the issue that blocks a leg. A disabled leg
          # never runs, even when its guard is set: the RTDB leg (#1323) adds
          # PYRIC_ORACLE_FIREBASE_CONFIG, which must not start oracle-run.
          - rig: oracle-run
            script: packages/conformance/src/run.ts
            guard: PYRIC_ORACLE_FIREBASE_CONFIG
            disabled: '#1270 and #1271 (credentials without a key file)'
          - rig: messaging-send
            script: packages/conformance/src/messaging-send-probes.ts
            guard: PYRIC_MESSAGING_SA_BASE64
            disabled: '#1387 (credentials without a key file)'
          # The Rules Test API legs authenticate through Workload Identity
          # Federation, so their guard is the GCP_WIF_PROVIDER variable.
          - rig: rules-firestore
            script: packages/conformance/src/run-rules.ts
            guard: GCP_WIF_PROVIDER
            wif: true
          - rig: rules-storage
            script: packages/conformance/src/run-rules-storage.ts
            guard: GCP_WIF_PROVIDER
            wif: true
    # id-token: write lets google-github-actions/auth exchange this job's
    # GitHub OIDC token for short-lived Google credentials on the wif legs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Check credential availability
        id: secret-check
        # A disabled leg skips with its blocking issue. Otherwise, when this
        # rig's guard (a secret, or GCP_WIF_PROVIDER for the wif legs) is
        # absent, a scheduled run fails and a dispatched run skips with a
        # warning. The guard var name is per-rig; ${!GUARD} reads whichever
        # one this leg needs. A wif leg with a provider but no service account
        # is a broken configuration and fails. The `missing` output names the
        # variable a leg lacks, for the state recorded at the end of the job.
        env:
          GUARD: ${{ matrix.guard }}
          DISABLED: ${{ matrix.disabled }}
          EVENT: ${{ github.event_name }}
          WIF: ${{ matrix.wif && 'true' || 'false' }}
          PYRIC_ORACLE_FIREBASE_CONFIG: ${{ secrets.PYRIC_ORACLE_FIREBASE_CONFIG }}
          PYRIC_MESSAGING_SA_BASE64: ${{ secrets.PYRIC_MESSAGING_SA_BASE64 }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PARITY_SA_EMAIL: ${{ vars.PARITY_SA_EMAIL }}
        run: |
          if [ -n "$DISABLED" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.rig }} is disabled until $DISABLED. Re-capture skipped."
          elif [ -z "${!GUARD}" ] && [ "$EVENT" = "schedule" ]; then
            echo "missing=$GUARD" >> "$GITHUB_OUTPUT"
            echo "::error::$GUARD not configured, so ${{ matrix.rig }} checked nothing against production. Configure it, or mark the leg disabled with its blocking issue."
            exit 1
          elif [ -z "${!GUARD}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "missing=$GUARD" >> "$GITHUB_OUTPUT"
            echo "::warning::$GUARD not configured. ${{ matrix.rig }} re-capture skipped. A scheduled run fails here."
          elif [ "$WIF" = "true" ] && [ -z "$PARITY_SA_EMAIL" ]; then
            echo "missing=PARITY_SA_EMAIL" >> "$GITHUB_OUTPUT"
            echo "::error::GCP_WIF_PROVIDER is set but PARITY_SA_EMAIL is not. Set both repository variables."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Writes an external-account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS and GOOGLE_CLOUD_PROJECT. Fails the leg
      # when the provider or the service account binding rejects the exchange.
      - name: Authenticate to Google Cloud
        if: steps.secret-check.outputs.available == 'true' && matrix.wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PARITY_SA_EMAIL }}
      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      # Gated like Install itself: no point restoring/saving a cache for a
      # leg that skips installing because its secret is absent.
      - name: Cache Bun dependencies
        if: steps.secret-check.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        if: steps.secret-check.outputs.available == 'true'
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Re-capture ${{ matrix.rig }} against production
        if: steps.secret-check.outputs.available == 'true'
        env:
          PYRIC_ORACLE_FIREBASE_CONFIG: ${{ secrets.PYRIC_ORACLE_FIREBASE_CONFIG }}
          PYRIC_MESSAGING_SA_BASE64: ${{ secrets.PYRIC_MESSAGING_SA_BASE64 }}
          # On a wif leg, a missing credential exits 1 instead of printing the
          # inert plan, which would otherwise report no drift.
          PARITY_REQUIRE_CREDENTIAL: ${{ matrix.wif && '1' || '' }}
        run: bun run ${{ matrix.script }}
      - name: Detect observation drift
        id: drift
        if: steps.secret-check.outputs.available == 'true'
        run: bun scripts/ci/oracle-drift-report.ts "${{ matrix.rig }}"
      # The diff above names the drifted files; these steps keep the
      # rewritten files themselves, so a person can review and commit them.
      # Timestamp-only rewrites come along too and are harmless to commit.
      - name: Collect rewritten observations
        if: failure() && steps.drift.outcome == 'failure'
        run: |
          dest="$RUNNER_TEMP/observation-drift"
          mkdir -p "$dest"
          git ls-files --modified --others --exclude-standard -z -- packages/conformance/observations |
            while IFS= read -r -d '' path; do
              if [ -f "$path" ]; then cp --parents "$path" "$dest"; fi
            done
      - name: Upload rewritten observations
        if: failure() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: observation-drift-${{ matrix.rig }}
          path: ${{ runner.temp }}/observation-drift
          retention-days: 14
          if-no-files-found: warn
      - name: Record this leg's state
        if: always()
        env:
          RIG: ${{ matrix.rig }}
          DISABLED: ${{ matrix.disabled }}
          MISSING: ${{ steps.secret-check.outputs.missing }}
          AVAILABLE: ${{ steps.secret-check.outputs.available }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          DRIFT_FOUND: ${{ steps.drift.outputs.found }}
          STATUS_DIR: ${{ runner.temp }}/oracle-leg
        run: bun scripts/ci/oracle-leg-report.ts record
      - name: Upload this leg's state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-leg-${{ matrix.rig }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-leg
          retention-days: 14
          if-no-files-found: warn

  # Says which legs checked production, and opens, updates or closes the one
  # lane:reliability issue. Runs even when a leg failed or never started. Its
  # own failure is a failed issue call, never a leg's result.
  report:
    name: Report which legs checked production
    needs: [unattended, credentialed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      # A leg that never uploaded has no file here, which the report counts as
      # not run, and the report names a failed download in its headline. Each
      # artifact lands in its own folder, since a re-run of failed legs uploads
      # under a new attempt number and the report reads the latest of each leg.
      - name: Download the leg states
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-leg-*
          path: ${{ runner.temp }}/oracle-leg
      - name: Test the report script
        run: bun test scripts/ci/oracle-leg-report.test.ts
      # Runs even when the report test fails, so a failing test cannot hide the
      # headline or the issue.
      - name: Report the leg states
        if: always()
        env:
          STATUS_DIR: ${{ runner.temp }}/oracle-leg
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          FILE_ISSUE: ${{ (github.event_name == 'schedule' || inputs.file-issue == true) && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/oracle-leg-report.ts report
