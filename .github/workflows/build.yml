# Workspace-wide build + test gate.
#
# Runs on every PR. Delegates to scripts/build.sh
# (the same orchestrator developers use locally) so CI and local
# build behavior can't drift.
#
# Workspace packages: pyric, pyric-admin, @pyric/cli, @pyric/ui,
# and @pyric/studio.

name: Build & Test

on:
  # Pure docs PRs are skipped; a mixed PR (any non-doc file) still runs.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  # A new push to the same branch/PR cancels the in-flight run instead of
  # billing both.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build all packages + run tests
    runs-on: ubuntu-latest
    steps:
      - name: Start job timer
        run: echo "PYRIC_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        # Playground carries Firebase deployment tooling for local demos. None
        # of this job's build, conformance, or test commands enter that workspace.
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Compat terminology lint (registry prose + generated docs)
        # Fails on colloquialisms, GitHub issue-number references, and
        # coding-tool/assistant names in packages/conformance/registry/*.ts prose
        # and the generated COMPAT.md docs. See packages/conformance/src/lint-terminology.ts
        # for the exact rules. Cheap, deterministic, no build/install needed first.
        run: bun run compat:lint-terms

      - name: Oracle audit gate (no NEW uncited ✓ COMPAT rows)
        # Runs packages/conformance/src/audit.ts and ratchets its high-risk
        # unprobed-✓ worklist against packages/conformance/baselines/audit-baseline.json.
        # Fails only when a PR introduces a NEW ✓ COMPAT row with no oracle
        # observation citing it.
        # Existing debt is tolerated via the baseline; pay it down by adding
        # an oracle citation (or downgrading the row) and dropping the id.
        run: bun run packages/conformance/src/audit-gate.ts

      - name: Oracle observation version guard
        # Fails if any packages/conformance/observations/*.json was captured against
        # a firebase version other than the one bun.lock currently resolves —
        # i.e. a `firebase` bump without re-capturing the prod-behavior record
        # the COMPAT matrices cite (INF-3/INF-4). Cheap, deterministic.
        run: bun run packages/conformance/src/check-observation-versions.ts

      - name: Build packages + embedded Studio (documentation omitted)
        # scripts/build.sh handles the cycle-tolerant bootstrap pass
        # (declaration stubs for every package) then the strict
        # topological build. Same script `npm run build` runs locally;
        # CI and local can't drift.
        run: bash scripts/build.sh --skip-docs

      - name: Oracle conformance gate (observations × probes)
        # Loads every observations/*.json (structural floor), asserts each
        # registry entry's captured prod values are intact (so the prod record
        # can't be edited to cheat), then RUNS each entry's conformance probe
        # (bun test) and derives pass/fail. A probe that fails is a LIVE
        # contradiction and fails the build. Status is derived from the probe,
        # never a hand-maintained field — see the script header (INF-3).
        # Runs AFTER the build: the probes import the built packages
        # (pyric/* → dist), so dist must exist first.
        run: bun run packages/conformance/src/check-observations.ts

      - name: Conformance graph integrity
        # Validates the compat registry, ratchets surface-census.ts's UNMAPPED
        # gaps against packages/conformance/baselines/census-baseline.json (failing on any NEW
        # gap or any stale/redundant deny-list entry — see census-gate.ts),
        # and checks the generated COMPAT.md docs haven't drifted from the
        # registry source. Runs after the build: surface-census imports the
        # built pyric/* packages, so dist must exist first.
        run: bun run compat:validate && bun run compat:census-gate && bun run packages/conformance/src/generate-docs.ts --check

      - name: Entry-path conformance gate (CLIFF, not a ratchet)
        # Runs packages/conformance/entry-path/*.ts in-process: one canonical
        # initialization program per service (app+auth, app+firestore,
        # app+database, app+storage), each adapted from Firebase's official
        # web quickstart shape. No baseline, no tolerance — a program either
        # passes, or its failure is cited by an entry-path/expected-failures.ts
        # record naming a real, currently-existing gap (compat:validate above
        # already checked every citation is valid), or the build fails.
        # Runs after the build: the programs import the built pyric/*
        # packages, so dist must exist first.
        run: bun run compat:entry-path

      - name: Assurance capability artifact (generated, must not drift)
        # Re-derives the assurance-engine capability table from the conformance
        # graph (authored dependency records + the rules-language snapshots,
        # capability report, rules corpus, and registry) and fails if the
        # committed assurance-capabilities/{capabilities.json,generated.ts}
        # disagree. Without this step a stale artifact can land on main while
        # CI stays green, which is exactly what happened before it was added:
        # `compat:check` chains this gate locally, but CI ran the other five
        # individually and never this one.
        # Runs after the build: the derivation loads the built pyric/* packages.
        run: bun run compat:assurance:check

      - name: Agent tool exposure contract
        # Every tool visible through the default MCP bridge, Playground agent,
        # or composed CLI registry must have an explicit exposure decision.
        # Additions cannot silently appear on one surface, and removals make
        # their annotations stale until the contract is updated deliberately.
        run: bun run tool:parity:check

      - name: Compat coverage gate (surface + behavior %, regression-only)
        # Runs packages/conformance/src/coverage.ts, which combines surface-census.ts
        # (mirrored SDK exports / SDK exports) and the compat ledger
        # (`conforms` rows / evaluated rows) per service and overall, then
        # diffs the result against the committed coverage-baseline.json.
        # Fails ONLY on regression (a conforms row demoted, a coverage %
        # dropping, a new orphan observation, more high-risk-unverified rows)
        # — never on an absolute percentage, which would invite relabeling
        # rows `conforms` just to clear a bar. Publishes the table to the job
        # summary so every PR shows the number.
        # Runs after the build: surface-census imports the built pyric/*
        # packages, so dist must exist first.
        run: set -o pipefail; bun run compat:coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run CLI tests
        # The other workspace suites run concurrently in library-tests.
        run: bun run test:ci:cli

      - name: Report timing and enforce three-minute job budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - PYRIC_CI_JOB_STARTED_AT ))
          echo "### Build + unit/conformance tests: ${elapsed}s / 180s" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 180 )); then
            echo "Build + unit/conformance tests exceeded the 180s CI budget (${elapsed}s)." >&2
            exit 1
          fi

  library-tests:
    name: Run library + UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Start job timer
        run: echo "PYRIC_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build workspace packages (embedded apps omitted)
        run: bash scripts/build.sh --packages-only

      - name: Run library, UI, Studio, and conformance tests
        run: bun run test:ci:libraries

      - name: Report timing and enforce three-minute job budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - PYRIC_CI_JOB_STARTED_AT ))
          echo "### Library + UI tests: ${elapsed}s / 180s" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 180 )); then
            echo "Library + UI tests exceeded the 180s CI budget (${elapsed}s)." >&2
            exit 1
          fi

  browser-conformance:
    name: Served app + SharedWorker conformance
    runs-on: ubuntu-latest
    steps:
      - name: Start job timer
        run: echo "PYRIC_CI_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build packages + embedded Studio (documentation omitted)
        run: bash scripts/build.sh --skip-docs

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Chromium system dependencies
        run: bunx playwright install-deps chromium

      - name: Served app + SharedWorker conformance
        # Runs the canonical firebase/* swap through pyric dev, including named
        # apps, cross-tab Auth isolation, config locking, deletion teardown,
        # and the worker-owned AI boundary. These are blocking oracle claims.
        run: bun run --cwd packages/cli test:app-conformance

      - name: Report timing and enforce three-minute job budget
        if: always()
        run: |
          elapsed=$(( $(date +%s) - PYRIC_CI_JOB_STARTED_AT ))
          echo "### Browser conformance: ${elapsed}s / 180s" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 180 )); then
            echo "Browser conformance exceeded the 180s CI budget (${elapsed}s)." >&2
            exit 1
          fi

  packaging:
    name: Packaging gate (pack + install + subpath resolution)
    runs-on: ubuntu-latest
    needs: [build-and-test, library-tests, browser-conformance]
    # Cost: the publish-shape gate runs only when the PR carries the
    # `ci-packaging` label (apply it on release PRs or ones touching package
    # manifests / exports / dist layout). Most code PRs do not need it.
    if: contains(github.event.pull_request.labels.*.name, 'ci-packaging')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      # The gate's consumer install resolves firebase/firebase-admin (large)
      # from the registry every run on a cold runner — measured 47s of the
      # 125s step. Persist the script's isolated npm cache across runs;
      # resolution/integrity checks still run, only downloads are reused.
      - name: Cache packaging npm downloads
        uses: actions/cache@v4
        with:
          path: /tmp/npm-cache-pyric-packaging-test
          key: packaging-npm-${{ runner.os }}-${{ hashFiles('packages/*/package.json') }}
          restore-keys: packaging-npm-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Packaging gate
        # scripts/packaging-test.sh: static manifest lint (publint + attw types
        # resolution + exports↔dist drift), then packs every publishable package
        # via `npm pack` (rewriting workspace:* → ^<version> via
        # scripts/lib/rewrite-workspace-deps.mjs — the same rewrite the real
        # `npm run pack` uses), installs the tarballs into a fresh consumer,
        # asserts every advertised subpath import resolves + the export shapes,
        # exercises the bin, runs a serve smoke, RUNS the libraries (runtime
        # asset paths), and pins the ESM-only + subpath-only module contract.
        run: npm run test:packaging

  install-matrix:
    name: Install matrix (${{ matrix.pm }})
    runs-on: ubuntu-latest
    needs: [build-and-test, library-tests, browser-conformance]
    # Cost: same as `packaging`, only runs under the `ci-packaging` label.
    if: contains(github.event.pull_request.labels.*.name, 'ci-packaging')
    # Package managers resolve exports / scoped names / local tarballs differently;
    # a lib that installs under npm can fail under pnpm or bun. Each leg installs
    # the REAL tarballs, imports every advertised subpath, and executes a small
    # no-network CLI smoke. fail-fast off so one manager's failure doesn't hide
    # the others'.
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Enable pnpm (corepack)
        if: matrix.pm == 'pnpm'
        run: corepack enable

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Pack the publishable libraries
        run: npm run pack

      - name: Install matrix — ${{ matrix.pm }}
        run: bash scripts/install-matrix.sh ${{ matrix.pm }}
