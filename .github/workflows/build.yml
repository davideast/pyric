# Workspace-wide build + test gate.
#
# Runs on every PR and on every merge queue group. Delegates to scripts/build.sh
# (the same orchestrator developers use locally) so CI and local
# build behavior can't drift.
#
# Workspace packages: pyric, pyric-admin, @pyric/cli, @pyric/ui,
# and @pyric/studio.

name: Build & Test

on:
  pull_request:
  # The merge queue tests a group of pull requests together on a
  # gh-readonly-queue/main/pr-<n>-<sha> branch and merges them when
  # `CI / required` passes there. A group has no pull request payload (no
  # labels, no body, no base and head), so the plan selects every proof for it:
  # the full check set, packaging, the install matrix, the standalone smoke,
  # the release contract, the RTDB differential, and the app scenarios. That
  # is at least what any pull request in the group selected. The removal guard
  # reads a pull request body, so it runs on each pull request, not the group.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Active enforcement: PRs execute only the check set determined by scripts/ci/plan.ts.
  CI_SELECTION_MODE: enforce
  # The toolchain every job here pins, in one place. restore-dist puts both in
  # the key of the build the pack job packs, so a toolchain bump rebuilds it
  # instead of restoring output built with the old one.
  BUN_VERSION: '1.3.11'
  NODE_VERSION: '22.15'

concurrency:
  # A new push to the same branch/PR cancels the in-flight run instead of
  # billing both. Each merge group has its own ref
  # (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>), so a group never cancels,
  # and is never cancelled by, a pull request run, a main run, or another group.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select required proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      check-set: ${{ steps.plan.outputs.check-set }}
      predicted-check-set: ${{ steps.plan.outputs.predicted-check-set }}
      packaging: ${{ steps.plan.outputs.packaging }}
      release-proof: ${{ steps.plan.outputs.release-proof }}
      rtdb-differential: ${{ steps.plan.outputs.rtdb-differential }}
      app-scenarios: ${{ steps.plan.outputs.app-scenarios }}
      app-plan: ${{ steps.app-plan.outputs.app-plan }}
      app-shards: ${{ steps.app-plan.outputs.app-shards }}
      app-plan-id: ${{ steps.app-plan.outputs.app-plan-id }}
      quarantine-base: ${{ steps.quarantine-base.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR endpoints and resolve merge base
        # plan.ts diffs base...head (git's triple-dot / merge-base form) so
        # check-set.ts only sees files the PR itself introduces, not whatever
        # moved on the base branch since the fork point. A depth-1 checkout
        # has neither base.sha nor head.sha as fetchable objects (both are
        # ancestors of the synthetic merge commit actions/checkout resolves
        # for pull_request events), so fetch them directly by SHA, then widen
        # only as far as needed to reach a common ancestor. Same self-heal
        # shape as resolve_base() in scripts/ci/conformance-coupling-gate.sh:
        # most PRs resolve after one or two small deepenings instead of
        # paying for the whole repository's history on every run.
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" "$CI_HEAD_SHA"
          depth=50
          until git merge-base "$CI_BASE_SHA" "$CI_HEAD_SHA" >/dev/null 2>&1; do
            if [ "$depth" -gt 6400 ]; then
              git fetch --no-tags --unshallow origin
              break
            fi
            git fetch --no-tags --deepen="$depth" origin
            depth=$((depth * 4))
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Read the quarantine list on the base branch
        # A pull request's test steps honour only the quarantine entries
        # already on its base branch, so a PR cannot quarantine the test it
        # breaks (scripts/lib/quarantine/source.ts). The step above fetched
        # the base commit.
        id: quarantine-base
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci/quarantine-base.ts "$CI_BASE_SHA"
      - name: Test fail-closed selection policy
        run: bun test scripts/ci/check-set.test.ts scripts/ci/plan.test.ts scripts/ci/required.test.ts scripts/ci/merge-group.test.ts scripts/ci/workflow-paths.test.ts scripts/ci/test-shard.test.ts scripts/ci/build-input-key.test.ts test/apps/shard-plan.test.ts
      - name: Select proof
        id: plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun scripts/ci/plan.ts
      - name: Restore the app scenario times main recorded
        # Only main saves app-durations-main-* (in CI / required), so a pull
        # request plans from the latest main run's times. The older
        # app-durations-* entries, which pull requests saved too, are read
        # only until main has saved one. A miss plans every app at the
        # default time, which still runs every app.
        uses: actions/cache/restore@v4
        with:
          path: test-results/app-durations.json
          key: app-durations-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            app-durations-main-
            app-durations-
      - name: Plan the app scenario shards
        # test/apps/shard-plan.ts groups the apps by dependency set and packs
        # them into shards whose App scenarios step should take about 90 s, at most 7 (#1571).
        # It always plans, so the App scenarios matrix is never empty, and
        # prints the plan's id, which names each shard's report artifact.
        id: app-plan
        run: bun test/apps/shard-plan.ts plan --durations test-results/app-durations.json

  deletion-guard:
    # A removed test cannot fail, so a pull request that deletes test files or
    # CI jobs (a rebase that reverts merged changes, for one) stays green.
    # This job fails such a pull request unless its body has a line
    # `Removes tests: <reason>`. The body is read live, so editing it and
    # re-running this job picks up the change.
    name: Test and CI job removals acknowledged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PR endpoints and resolve merge base
        # Same fetch as the plan job: both endpoints by SHA, deepened until
        # they share a merge base.
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" "$CI_HEAD_SHA"
          depth=50
          until git merge-base "$CI_BASE_SHA" "$CI_HEAD_SHA" >/dev/null 2>&1; do
            if [ "$depth" -gt 6400 ]; then
              git fetch --no-tags --unshallow origin
              break
            fi
            git fetch --no-tags --deepen="$depth" origin
            depth=$((depth * 4))
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Test the guard
        run: bun test scripts/ci/deletion-guard.test.ts
      - name: Read the pull request body
        # The event payload holds the body as it was when the run started; a
        # re-run after an edit needs the current one. Falls back to the
        # payload when the API read fails.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"; then
            echo "PR_BODY_FILE=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"
          fi
      - name: Check removals against the merge base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci/deletion-guard.ts "$CI_BASE_SHA" "$CI_HEAD_SHA"

  knip-audit:
    name: Advisory Knip audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.check-set == 'full'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PR endpoints and resolve merge base
        # Same rationale and self-heal shape as the `plan` job's identically
        # named step: knip-audit.ts also diffs base...head (falling back to
        # origin/main...HEAD, then to "no changed paths") purely to bucket
        # findings into PR-introduced vs. legacy. It's advisory and
        # continue-on-error, so a resolution failure here just degrades the
        # bucketing, but resolving it properly is nearly free and keeps the
        # audit's PR/legacy split accurate without cloning full history.
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" "$CI_HEAD_SHA"
          depth=50
          until git merge-base "$CI_BASE_SHA" "$CI_HEAD_SHA" >/dev/null 2>&1; do
            if [ "$depth" -gt 6400 ]; then
              git fetch --no-tags --unshallow origin
              break
            fi
            git fetch --no-tags --deepen="$depth" origin
            depth=$((depth * 4))
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Run Advisory Knip Audit
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci/knip-audit.ts

  build-packages:
    name: Build workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.check-set == 'full'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        # Playground carries Firebase deployment tooling for local demos. None
        # of this job's build, conformance, or test commands enter that workspace.
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Oracle observation version guard
        # Fails if any packages/conformance/observations/*.json was captured against
        # a firebase version other than the one bun.lock currently resolves —
        # i.e. a `firebase` bump without re-capturing the prod-behavior record
        # the COMPAT matrices cite (INF-3/INF-4). Cheap, deterministic.
        run: bun run packages/conformance/src/check-observation-versions.ts

      - name: Build packages (site omitted)
        # Content-keyed: restores the previous build when no build input
        # changed (scripts/ci/build-input-key.sh), otherwise runs
        # scripts/build.sh --packages-only — the same script `npm run build`
        # runs locally, so CI and local can't drift.
        uses: ./.github/actions/restore-dist
        with:
          flavor: packages

      - name: Agent tool exposure contract
        # Every tool visible through the default MCP bridge, Playground agent,
        # or composed CLI registry must have an explicit exposure decision.
        # Additions cannot silently appear on one surface, and removals make
        # their annotations stale until the contract is updated deliberately.
        run: bun run tool:parity:check

      - name: Docs site typecheck
        # The docs site is excluded from the packages build key and from the
        # package builds, so nothing else type-checks its Astro pages and
        # components. The check reads the built package dist restored above.
        run: bun run --cwd packages/site-docs typecheck

  pack-packages:
    name: Pack the published packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    # The one pack of a run. It builds what the release builds, the Studio
    # site embedded in @pyric/cli included, packs it once with
    # scripts/pack-packages.sh, and uploads the tarballs with the manifest
    # that records each tarball's sha256. The app scenarios, the packaging
    # gate and the install matrix test these bytes and pack nothing of their
    # own; each checks the tarballs against the manifest before using them.
    # It runs beside build-packages, not after it, because the packages-only
    # build leaves the Studio site out of the CLI tarball.
    if: needs.plan.outputs.app-scenarios == 'true' || (needs.plan.outputs.check-set == 'full' && needs.plan.outputs.packaging == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Build packages and the embedded Studio site
        # Pull requests may restore this build from its exact-key cache. A
        # push to main and the nightly run always build it fresh, as the
        # packaging gate did before it took the tarballs from this job.
        uses: ./.github/actions/restore-dist
        with:
          flavor: studio
          fresh: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: Pack the published packages
        run: bash scripts/pack-packages.sh --skip-build
      - name: Upload the packed tarballs and their manifest
        uses: actions/upload-artifact@v4
        with:
          name: packed-packages
          path: dist/packages/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload the build the tarballs came from
        # The packaging gate's exports and dist drift check reads the
        # workspace dist, so it gets the dist these tarballs were packed from.
        uses: actions/upload-artifact@v4
        with:
          name: packed-build
          path: |
            packages/*/dist
            !packages/site-docs/dist
            packages/cli/src/assurance/.generated
            packages/cli/src/conformance/.generated
            packages/cli/src/cli/service-commands.generated.ts
            packages/cli/src/bridge/tool-families.generated.ts
            packages/cli/src/bridge/surface/manifest.generated.ts
            packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
            packages/cli/src/bridge/surface/descriptions.generated.ts
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  build-and-test:
    name: Build all packages + run tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build-packages]
    if: needs.plan.outputs.check-set == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build packages (site omitted)
        uses: ./.github/actions/restore-dist
        with:
          flavor: packages

      - name: Run CLI tests
        # Sharded across 2 runners by scripts/ci/test-shard.ts (bun test has no
        # shard option, so files are split by index modulo 2). The CLI suite is
        # load-sensitive under CPU contention (verify replays flip verdicts when
        # sharing a 2-core VM).
        # Sharding gives each half of the suite its own dedicated 2-core VM
        # without CPU starvation, cutting job wall-clock time in half (~48s).
        # --quarantine applies quarantine only in these CI test steps; every
        # other caller of the runners, publish included, keeps its exit code.
        env:
          PYRIC_QUARANTINE_BASE_ENTRIES: ${{ needs.plan.outputs.quarantine-base }}
        run: bun scripts/ci/test-shard.ts --shard=${{ matrix.shard }}/2 --quarantine

      - name: Upload the quarantine report
        # Each quarantined test's result in this run, which the release check
        # in main-failure.yml reads (scripts/lib/quarantine). Nothing is
        # written when no entry is active and nothing matched one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-report-cli-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: test-results/quarantine/
          if-no-files-found: ignore
          retention-days: 30

  library-tests:
    name: Run library + UI tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, build-packages]
    if: needs.plan.outputs.check-set == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build workspace packages (embedded apps omitted)
        uses: ./.github/actions/restore-dist
        with:
          flavor: packages

      - name: Run library, UI, and Studio tests
        # The conformance suite (half this step's former serial time) runs in
        # its own conformance-suite job. In-job concurrency was measured first
        # and rejected: on a 2-core runner two CPU-bound streams saved 16s and
        # starved the conformance model's 60s beforeAll budget into a timeout.
        # packages/pyric, about 240s of the 290s serial step, is split across
        # the two shards by scripts/ci/test-shard.ts; shard 2 also runs the
        # remaining suites (test:ci:libraries:rest, about 45s).
        # test:ci:libraries stays the canonical serial form for local runs and
        # the release gates; scripts/ci/library-split.test.ts pins
        # core = libraries minus conformance and rest = core minus
        # packages/pyric, so the split cannot drift.
        # --quarantine applies quarantine only in these CI test steps; every
        # other caller of the runners, publish included, keeps its exit code.
        env:
          PYRIC_QUARANTINE_BASE_ENTRIES: ${{ needs.plan.outputs.quarantine-base }}
        run: |
          bun scripts/ci/test-shard.ts --package=pyric --shard=${{ matrix.shard }}/2 --quarantine
          if [ "${{ matrix.shard }}" = "2" ]; then bun run test:ci:libraries:rest; fi

      - name: Upload the quarantine report
        # Each quarantined test's result in this run, which the release check
        # in main-failure.yml reads (scripts/lib/quarantine). Nothing is
        # written when no entry is active and nothing matched one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-report-pyric-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: test-results/quarantine/
          if-no-files-found: ignore
          retention-days: 30

  rtdb-differential:
    name: RTDB differential (sandbox, SharedWorker host, Node host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, build-packages]
    # Selected by scripts/ci/plan.ts for changes to the served hosts, the RTDB
    # engine, or the rules engine, and always outside pull requests.
    if: needs.plan.outputs.rtdb-differential == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - uses: ./.github/actions/restore-dist
        with:
          flavor: packages
      - name: Fixed seeds and saved fixtures
        run: bun test --cwd packages/cli ./test/serve/rtdb-differential/rtdb-differential.gate.ts
      - name: Nightly sweep
        # The nightly run adds 2000 longer sequences; any mismatch prints its
        # shrunk sequence.
        if: github.event_name == 'schedule'
        run: bun packages/cli/test/serve/rtdb-differential/differential.ts --start=1000 --count=2000 --steps=40 --chunks=2

  app-scenarios:
    name: App scenarios (${{ matrix.shard.index }}/${{ matrix.shard.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, pack-packages]
    # Selected by scripts/ci/plan.ts for changes to the Vite plugin and served
    # hosts, the register hook, pyric-admin, the AI broker, the published
    # manifests, packaging, or test/apps, and always outside pull requests.
    # Every selected run drives every app that is not slow, split into the
    # shards the plan job made; CI / required checks that the shards together
    # ran each planned app exactly once.
    if: needs.plan.outputs.app-scenarios == 'true'
    strategy:
      # A failing shard does not cancel the others, so one run reports every failing app.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.app-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Each app installs firebase, firebase-admin and vite from the registry.
      # The shared npm cache reuses those downloads; resolution still runs.
      - name: Cache app npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyric-app-scenarios-npm
          key: app-scenarios-npm-${{ runner.os }}-${{ hashFiles('test/apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: app-scenarios-npm-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Download the packed tarballs
        uses: actions/download-artifact@v4
        with:
          name: packed-packages
          path: dist/packages
      - name: Download the build the tarballs came from
        uses: actions/download-artifact@v4
        with:
          name: packed-build
          path: packages
      - name: Check the tarballs against the pack manifest
        run: node scripts/lib/proven-stamp.mjs check dist/packages .
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('packages/cli/package.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium browser
        # Unconditional: the runner resolves the root @playwright/test, whose
        # Chromium build can differ from the one a shared cache entry holds.
        # With the build present this is a no-op.
        run: bunx playwright install chromium
      - name: Test the app selection and the driver
        # One shard runs these, and the plan counts their time against it.
        if: matrix.shard.runnerTests
        run: bun test test/apps/selection.test.ts test/apps/driver.test.ts test/apps/driver-network.test.ts test/apps/install.test.ts test/apps/dependency-store.test.ts test/apps/packed-files.test.ts test/apps/unreaped-exit.test.ts test/apps/schedule.test.ts test/apps/cleanup.test.ts
      - name: Write the shard plan
        env:
          APP_PLAN: ${{ needs.plan.outputs.app-plan }}
        run: mkdir -p test-results && printenv APP_PLAN > test-results/app-plan.json
      - name: App scenarios
        # Each app in test/apps installs from the tarballs the pack job made
        # (the CLI as it ships, Studio site included) plus registry
        # firebase, firebase-admin and vite, runs its own Vite dev server and
        # server scripts, and drives its page in Chromium. npm downloads go to
        # ~/.cache/pyric-app-scenarios-npm, the cache restored above. Apps that
        # wait on real timeouts (`export const slow = true`) are skipped here,
        # on pull requests and main alike; slow-scenarios.yml runs them. The
        # runner fails before installing anything unless the plan's apps are
        # exactly the apps an unsharded run would select, then runs this
        # shard's apps, longest first.
        # --quarantine applies quarantine only in these CI test steps; every
        # other caller of the runners, publish included, keeps its exit code.
        env:
          PYRIC_QUARANTINE_BASE_ENTRIES: ${{ needs.plan.outputs.quarantine-base }}
        run: bun test/apps/run.ts --packages dist/packages --skip-slow --shard-plan test-results/app-plan.json --shard ${{ matrix.shard.index }} --quarantine
      - name: Upload the quarantine report
        # Each quarantined test's result in this run, which the release check
        # in main-failure.yml reads (scripts/lib/quarantine). Nothing is
        # written when no entry is active and nothing matched one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-report-apps-${{ matrix.shard.index }}-a${{ github.run_attempt }}
          path: test-results/quarantine/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the shard's report
        # The apps this shard ran, for the completeness check in CI / required.
        # A shard that stopped before writing it leaves nothing, and the check
        # then fails on its missing report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-shard-report-${{ needs.plan.outputs.app-plan-id }}-${{ matrix.shard.index }}
          path: test-results/app-shards/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1
      - name: Upload app scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-scenarios-logs-${{ matrix.shard.index }}-${{ github.run_attempt }}
          path: test-results/apps/
          if-no-files-found: warn
          retention-days: 7

  conformance-suite:
    name: Conformance suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build-packages]
    if: needs.plan.outputs.check-set == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - uses: ./.github/actions/restore-dist
        with:
          flavor: packages
      - name: Run conformance tests
        # Split out of library-tests so both halves run on their own machine;
        # deriving the conformance model is CPU-heavy and its tests carry 60s
        # beforeAll budgets that CPU contention can starve.
        # --quarantine applies quarantine only in these CI test steps; every
        # other caller of the runners, publish included, keeps its exit code.
        env:
          PYRIC_QUARANTINE_BASE_ENTRIES: ${{ needs.plan.outputs.quarantine-base }}
        run: bun scripts/ci/quarantine-test.ts --cwd packages/conformance --suite conformance --quarantine
      - name: Upload the quarantine report
        # Each quarantined test's result in this run, which the release check
        # in main-failure.yml reads (scripts/lib/quarantine). Nothing is
        # written when no entry is active and nothing matched one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-report-conformance-a${{ github.run_attempt }}
          path: test-results/quarantine/
          if-no-files-found: ignore
          retention-days: 30

  browser-conformance:
    name: Served app + SharedWorker conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build-packages]
    if: needs.plan.outputs.check-set == 'full'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build packages, unified Astro site, and composed public site
        # Content-keyed like the packages flavor, over the full build's inputs
        # (which add the site sources and compose scripts). A hit restores the
        # embedded site and dist/site; a miss runs scripts/build.sh and
        # scripts/build-site.sh exactly as before.
        uses: ./.github/actions/restore-dist
        with:
          flavor: site

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('packages/cli/package.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd packages/cli && bunx playwright install chromium

      # `playwright install-deps chromium` (23s of apt on every run) is
      # intentionally absent: the ubuntu-latest image ships Chrome's shared
      # library set, so the bundled Chromium launches without it. If a runner
      # image update ever drops a library, the browser-launch failure here is
      # loud and the step comes back with an apt cache.

      - name: Browser e2e
        # Every file under the root e2e config: the SharedWorker topology
        # proofs (named apps, cross-tab Auth isolation, config locking,
        # deletion teardown, the worker-owned AI boundary), runtime identity,
        # Flow treatments, the listener contract, and every other served-page
        # proof. Running the whole config means a new file cannot be left out
        # of CI. The folders with their own config run in the steps below.
        run: bun run --cwd packages/cli test:e2e --output=test-results/e2e --trace=retain-on-failure

      - name: CLI-hosted Studio
        run: bun run --cwd packages/cli test:site-cli --output=test-results/site-cli --trace=retain-on-failure

      - name: Public Studio
        run: bun run --cwd packages/cli test:site-static --output=test-results/site-static --trace=retain-on-failure

      - name: Node host smoke set
        run: bun run --cwd packages/cli test:hosted-smoke --output=test-results/hosted-smoke --trace=retain-on-failure

      - name: Upload browser conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-conformance-results-${{ github.run_attempt }}
          path: packages/cli/test-results/
          if-no-files-found: warn
          retention-days: 7

  release-contract:
    name: Release wrapper contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    # release-proof is the `ci-packaging` label on a pull request and always
    # true on a merge group, which has no labels to read.
    if: needs.plan.outputs.predicted-check-set == 'release-only' || needs.plan.outputs.release-proof == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun test scripts/publish-alpha.test.ts scripts/lib/proven-stamp.test.ts

  conformance-gates:
    name: Conformance gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build-packages]
    if: needs.plan.outputs.check-set == 'full'
    steps:
      - uses: actions/checkout@v4
        with:
          # The coupling gate diffs against the PR base; a depth-1 checkout has
          # no merge base to find (same reason plan/knip-audit fetch in full).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Configure job-local surface census cache
        run: echo "PYRIC_SURFACE_CENSUS_PATH=$RUNNER_TEMP/pyric-surface-census.json" >> "$GITHUB_ENV"
      - uses: ./.github/actions/restore-dist
        with:
          flavor: packages
      - name: Engine↔evidence coupling gate
        # Fails when rules/sandbox engine files move without any conformance
        # evidence moving with them, unless a commit in the range carries a
        # `Conformance-Exempt: <reason>` trailer.
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/ci/conformance-coupling-gate.sh

      - name: Conformance gate chain
        # The five gates that used to run serially at the tail of
        # build-and-test (audit gate, observations × probes, graph integrity,
        # entry-path cliff, verdict projection, coverage ratchet — order
        # unchanged in scripts/ci/conformance-gates.sh). A job of their own
        # keeps them off the critical path without pairing them against the
        # CLI suite, whose verify replays flip verdicts under CPU contention
        # (reproduced deterministically while validating this layout).
        run: bash scripts/ci/conformance-gates.sh

  packaging:
    name: Packaging gate (pack + install + subpath resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, pack-packages]
    # Cost: the publish-shape gate is expensive, so it runs only when it can
    # tell us something. `plan` sets `packaging` when the diff touches the
    # scaffolder, a published package manifest, or the packaging scripts —
    # the cases that invalidate what this job proves. The `ci-packaging` label
    # forces it for anything the diff cannot infer, such as a release PR.
    if: needs.plan.outputs.check-set == 'full' && needs.plan.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The gate's consumer install resolves firebase/firebase-admin (large)
      # from the registry every run on a cold runner — measured 47s of the
      # 125s step. Persist the script's isolated npm cache across runs;
      # resolution/integrity checks still run, only downloads are reused.
      - name: Cache packaging npm downloads
        uses: actions/cache@v4
        with:
          path: /tmp/npm-cache-pyric-packaging-test
          key: packaging-npm-${{ runner.os }}-${{ hashFiles('packages/*/package.json') }}
          restore-keys: packaging-npm-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download the packed tarballs
        uses: actions/download-artifact@v4
        with:
          name: packed-packages
          path: dist/packages

      - name: Download the build the tarballs came from
        uses: actions/download-artifact@v4
        with:
          name: packed-build
          path: packages

      - name: Check the tarballs against the pack manifest
        run: node scripts/lib/proven-stamp.mjs check dist/packages .

      - name: Packaging gate
        # The release path: the pack job built and packed every publishable
        # package with scripts/pack-packages.sh, and
        # scripts/packaging-test.sh --packages tests those tarballs with no
        # build or pack of its own. It lints them (publint + attw types
        # resolution on the tarballs; the exports↔dist drift check reads the
        # workspace dist the tarballs came from, downloaded above), installs
        # the tarballs into a fresh consumer,
        # asserts every advertised subpath import resolves + the export shapes,
        # exercises the bin, runs a serve smoke, RUNS the libraries (runtime
        # asset paths), and pins the ESM-only + subpath-only module contract.
        run: bash scripts/packaging-test.sh --packages dist/packages

  install-matrix:
    name: Install matrix (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, packaging]
    # Cost: same as `packaging`, and gated on the same signal.
    if: needs.plan.outputs.check-set == 'full' && (needs.plan.outputs.release-proof == 'true' || (needs.plan.outputs.packaging == 'true' && github.event_name == 'pull_request'))
    # Package managers resolve exports / scoped names / local tarballs differently;
    # a lib that installs under npm can fail under pnpm or bun. Each leg installs
    # the REAL tarballs, imports every advertised subpath, and executes a small
    # no-network CLI smoke. fail-fast off so one manager's failure doesn't hide
    # the others'.
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (corepack)
        if: matrix.pm == 'pnpm'
        # The corepack bundled with Node 22.15 resolves `pnpm@latest` and then
        # looks for `bin/pnpm.cjs`, which pnpm 12 no longer ships: its `bin.pnpm`
        # is a plain `pnpm` file, so the shim exits MODULE_NOT_FOUND before any
        # install runs. Updating corepack first keeps this leg on current pnpm,
        # which is what the matrix exists to prove. `pnpm --version` fails the
        # step with a readable error if the shim is still wrong.
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      # The audit step (scripts/audit-packed-cli.mjs) imports typescript from
      # the repo root; the check-set consolidation dropped this install and the
      # label-gated matrix hid the break until the next labeled run.
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Download the tarballs the packaging gate proved
        # The pack job's tarballs; this job needs the packaging gate, so it
        # runs only after the gate passed on these same bytes.
        uses: actions/download-artifact@v4
        with:
          name: packed-packages
          path: dist/packages

      - name: Check the tarballs against the pack manifest
        run: node scripts/lib/proven-stamp.mjs check dist/packages .

      - name: Install matrix — ${{ matrix.pm }}
        env:
          PYRIC_PACKAGE_ARTIFACT_DIR: dist/packages
        run: bash scripts/install-matrix.sh ${{ matrix.pm }}

  standalone:
    name: Standalone binary smoke (compile + vendor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    # Cost: compiling a host-target binary is heavy (~100 MB executable), so
    # this runs under the same `ci-packaging` label policy as `packaging` —
    # apply the label on release PRs or ones touching the standalone/vendor
    # pipeline (scripts/compile.ts, the smokes, the workspace-dep rewrite).
    # A merge group always runs it (release-proof).
    if: needs.plan.outputs.check-set == 'full' && needs.plan.outputs.release-proof == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build packages and unified Astro site
        # The standalone binary embeds the full build; the composed dist/site
        # the site flavor also restores is unused here and harmless.
        uses: ./.github/actions/restore-dist
        with:
          flavor: site

      - name: Compile the host-target standalone binary
        run: bun run --cwd packages/cli compile host

      - name: Standalone smoke (portable commands + embedded serve)
        run: bun run --cwd packages/cli smoke:standalone

      - name: Vendor smoke (vendor + init consumer install story)
        run: bun run --cwd packages/cli smoke:vendor

  native-conformance:
    name: Native SDK conformance (${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.check-set == 'full'
    # The Kotlin client is experimental: its job runs and reports, but a
    # failure does not fail the native-conformance result that CI / required reads.
    continue-on-error: ${{ matrix.blocking == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: kotlin
            os: ubuntu-latest
            blocking: false
          - sdk: flutter
            os: ubuntu-latest
            blocking: true
          - sdk: swift
            os: macos-latest
            blocking: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        id: kotlin-jdk
        if: matrix.sdk == 'kotlin'
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Kotlin client tests
        id: kotlin-tests
        if: matrix.sdk == 'kotlin' && steps.kotlin-jdk.outcome == 'success'
        # Step-level continue-on-error keeps the GitHub Check Run green (`✓`) so
        # unrelated PRs and agents do not see a failing check or rebuild on
        # experimental Kotlin flakes, while preserving full Gradle logs + reports.
        continue-on-error: true
        working-directory: packages/kt-client
        run: ./gradlew test --continue --stacktrace

      - name: Summarize experimental Kotlin test status
        if: always() && matrix.sdk == 'kotlin'
        run: |
          if [ "${{ steps.kotlin-jdk.outcome }}" != "success" ] || [ "${{ steps.kotlin-tests.outcome }}" != "success" ]; then
            {
              echo "### ⚠️ Experimental Kotlin SDK tests failed (non-blocking)"
              echo "- \`Set up JDK 21\`: \`${{ steps.kotlin-jdk.outcome }}\`"
              echo "- \`Run Kotlin client tests\`: \`${{ steps.kotlin-tests.outcome }}\`"
              echo "- Full stacktraces are in the **Run Kotlin client tests** step log above, and HTML/XML reports are attached as \`kotlin-test-reports\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Experimental Kotlin SDK tests passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Kotlin test reports on failure
        if: always() && matrix.sdk == 'kotlin' && steps.kotlin-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            packages/kt-client/**/build/reports/tests/
            packages/kt-client/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Flutter
        if: matrix.sdk == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter client tests
        if: matrix.sdk == 'flutter'
        working-directory: packages/flutter-client
        run: flutter test

      - name: Cache Swift build artifacts
        if: matrix.sdk == 'swift'
        uses: actions/cache@v4
        with:
          path: packages/swift-client/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/swift-client/Package.swift', 'packages/swift-client/Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Swift client tests
        if: matrix.sdk == 'swift'
        run: swift test --package-path packages/swift-client

  required:
    name: CI / required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [plan, deletion-guard, build-packages, pack-packages, build-and-test, library-tests, conformance-suite, browser-conformance, conformance-gates, native-conformance, release-contract, packaging, install-matrix, standalone, rtdb-differential, app-scenarios]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify every selected proof passed
        env:
          CI_CHECK_SET: ${{ needs.plan.outputs.check-set }}
          CI_REQUIRE_PACKAGING: ${{ needs.plan.outputs.release-proof }}
          CI_REQUIRE_RTDB_DIFFERENTIAL: ${{ needs.plan.outputs.rtdb-differential }}
          CI_REQUIRE_APP_SCENARIOS: ${{ needs.plan.outputs.app-scenarios }}
          CI_REQUIRE_DELETION_GUARD: ${{ github.event_name == 'pull_request' }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/ci/required.ts
      - name: Download the app shard reports
        if: always() && needs.plan.outputs.app-scenarios == 'true'
        # No report at all (every shard stopped early) is left to the check
        # below. Only this plan's reports are read: a rerun that planned
        # differently leaves the earlier plan's reports under another id.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: app-shard-report-${{ needs.plan.outputs.app-plan-id }}-*
          path: test-results/app-shards
          merge-multiple: true
      - name: Check the shards ran every planned app exactly once
        # The shard completeness rule for the app scenarios (#1571). Each
        # shard's runner already checked that the plan covers every app that
        # is not slow; this checks that the shards together ran each planned
        # app exactly once, in its own shard, so no shard can drop an app or
        # come back empty and still count.
        if: always() && needs.plan.outputs.app-scenarios == 'true'
        env:
          APP_PLAN: ${{ needs.plan.outputs.app-plan }}
        run: bun test/apps/shard-plan.ts check --reports test-results/app-shards --durations-out test-results/app-durations.json
      - name: Record the app scenario times
        # Main and the nightly run save the times the next plans read. Pull
        # requests save nothing, so their caches cannot crowd out main's.
        if: always() && needs.plan.outputs.app-scenarios == 'true' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v4
        with:
          path: test-results/app-durations.json
          key: app-durations-main-${{ github.run_id }}-${{ github.run_attempt }}
