# Workspace-wide build + test gate.
#
# Runs on every PR. Delegates to scripts/build.sh
# (the same orchestrator developers use locally) so CI and local
# build behavior can't drift.
#
# Workspace packages: pyric, pyric-admin, @pyric/cli, @pyric/ui,
# and @pyric/studio.

name: Build & Test

on:
  pull_request:

concurrency:
  # A new push to the same branch/PR cancels the in-flight run instead of
  # billing both.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground-caniuse:
    name: Playground can-i-use browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install browser workspace
        run: bun install --frozen-lockfile

      - name: Build clean-checkout package graph and conformance projections
        run: bash scripts/build.sh --packages-only

      - name: Test tool, prompt, registration, and browser bundle budget
        run: bun run --cwd packages/playground test:can-i-use

  build-and-test:
    name: Build all packages + run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        # Playground carries Firebase deployment tooling for local demos. None
        # of this job's build, conformance, or test commands enter that workspace.
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Oracle observation version guard
        # Fails if any packages/conformance/observations/*.json was captured against
        # a firebase version other than the one bun.lock currently resolves —
        # i.e. a `firebase` bump without re-capturing the prod-behavior record
        # the COMPAT matrices cite (INF-3/INF-4). Cheap, deterministic.
        run: bun run packages/conformance/src/check-observation-versions.ts

      - name: Build packages + embedded Studio (documentation omitted)
        # scripts/build.sh handles the cycle-tolerant bootstrap pass
        # (declaration stubs for every package) then the strict
        # topological build. Same script `npm run build` runs locally;
        # CI and local can't drift.
        run: bash scripts/build.sh --skip-docs

      - name: Agent tool exposure contract
        # Every tool visible through the default MCP bridge, Playground agent,
        # or composed CLI registry must have an explicit exposure decision.
        # Additions cannot silently appear on one surface, and removals make
        # their annotations stale until the contract is updated deliberately.
        run: bun run tool:parity:check

      - name: Run CLI tests
        # The other workspace suites run concurrently in library-tests.
        run: bun run test:ci:cli

      - name: Upload built workspace for conformance gates
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build-${{ github.sha }}
          retention-days: 1
          include-hidden-files: true
          path: |
            packages/pyric/dist
            packages/pyric-admin/dist
            packages/create-pyric/dist
            packages/cli/dist
            packages/ui/dist
            packages/cli/src/assurance/.generated
            packages/cli/src/conformance/.generated

  conformance-gates:
    name: Derive and verify trust model
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Download built workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-build-${{ github.sha }}
          # upload-artifact strips the common `packages/` ancestor.
          path: packages

      - name: Oracle audit gate (no NEW uncited ✓ COMPAT rows)
        # Runs the shared conformance model after workspace packages exist and
        # ratchets its high-risk unprobed-✓ worklist against audit-baseline.json.
        # Existing debt is tolerated; a new uncited conforming row is not.
        run: bun run packages/conformance/src/audit-gate.ts

      - name: Oracle conformance gate (observations × probes)
        # Loads every observations/*.json, protects their captured values, then
        # runs each live probe. A contradiction fails the build.
        run: bun run packages/conformance/src/check-observations.ts

      - name: Conformance graph integrity
        # Validates the registry and ratchets unmapped surface gaps without
        # comparing disposable generated documentation.
        run: bun run --cwd packages/conformance typecheck && bun run compat:validate && bun run compat:census-gate

      - name: Entry-path conformance gate (CLIFF, not a ratchet)
        # Runs one canonical initialization program per supported service. Each
        # must pass or cite a real, currently-existing expected failure.
        run: bun run compat:entry-path

      - name: Runtime conformance verdict projection
        # Re-derives the model and checks the ignored build-time CLI projection.
        run: bun run compat:conformance:check

      - name: Compat coverage gate (surface + behavior %, regression-only)
        # Publishes current trust numbers and fails only when their evidence
        # regresses against the committed baseline.
        run: set -o pipefail; bun run compat:coverage | tee -a "$GITHUB_STEP_SUMMARY"

  library-tests:
    name: Run library + UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build workspace packages (embedded apps omitted)
        run: bash scripts/build.sh --packages-only

      - name: Run library, UI, Studio, and conformance tests
        run: bun run test:ci:libraries

  browser-conformance:
    name: Served app + SharedWorker conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'

      - name: Build packages + embedded Studio (documentation omitted)
        run: bash scripts/build.sh --skip-docs

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Chromium system dependencies
        run: bunx playwright install-deps chromium

      - name: Served app + SharedWorker conformance
        # Runs the canonical firebase/* swap through pyric dev, including named
        # apps, cross-tab Auth isolation, config locking, deletion teardown,
        # and the worker-owned AI boundary. These are blocking oracle claims.
        run: bun run --cwd packages/cli test:app-conformance

  packaging:
    name: Packaging gate (pack + install + subpath resolution)
    runs-on: ubuntu-latest
    needs: [build-and-test, conformance-gates, library-tests, browser-conformance]
    # Cost: the publish-shape gate runs only when the PR carries the
    # `ci-packaging` label (apply it on release PRs or ones touching package
    # manifests / exports / dist layout). Most code PRs do not need it.
    if: contains(github.event.pull_request.labels.*.name, 'ci-packaging')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      # The gate's consumer install resolves firebase/firebase-admin (large)
      # from the registry every run on a cold runner — measured 47s of the
      # 125s step. Persist the script's isolated npm cache across runs;
      # resolution/integrity checks still run, only downloads are reused.
      - name: Cache packaging npm downloads
        uses: actions/cache@v4
        with:
          path: /tmp/npm-cache-pyric-packaging-test
          key: packaging-npm-${{ runner.os }}-${{ hashFiles('packages/*/package.json') }}
          restore-keys: packaging-npm-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Packaging gate
        # scripts/packaging-test.sh: static manifest lint (publint + attw types
        # resolution + exports↔dist drift), then packs every publishable package
        # via `npm pack` (rewriting workspace:* → ^<version> via
        # scripts/lib/rewrite-workspace-deps.mjs — the same rewrite the real
        # `npm run pack` uses), installs the tarballs into a fresh consumer,
        # asserts every advertised subpath import resolves + the export shapes,
        # exercises the bin, runs a serve smoke, RUNS the libraries (runtime
        # asset paths), and pins the ESM-only + subpath-only module contract.
        run: npm run test:packaging

  install-matrix:
    name: Install matrix (${{ matrix.pm }})
    runs-on: ubuntu-latest
    needs: [build-and-test, conformance-gates, library-tests, browser-conformance]
    # Cost: same as `packaging`, only runs under the `ci-packaging` label.
    if: contains(github.event.pull_request.labels.*.name, 'ci-packaging')
    # Package managers resolve exports / scoped names / local tarballs differently;
    # a lib that installs under npm can fail under pnpm or bun. Each leg installs
    # the REAL tarballs, imports every advertised subpath, and executes a small
    # no-network CLI smoke. fail-fast off so one manager's failure doesn't hide
    # the others'.
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, bun]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Enable pnpm (corepack)
        if: matrix.pm == 'pnpm'
        run: corepack enable

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Pack the publishable libraries
        run: npm run pack

      - name: Install matrix — ${{ matrix.pm }}
        run: bash scripts/install-matrix.sh ${{ matrix.pm }}
