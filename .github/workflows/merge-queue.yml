# Batching merge queue for personal repositories where GitHub's
# organization-only `merge_group` queue cannot be enabled
# (scripts/ci/merge-queue.ts decides, scripts/ci/merge-queue-github.ts acts).
#
# Apply the `merge-queue` label to an open pull request targeting `main` once it
# is approved to land. Serialized under a single concurrency group, so `main`
# only ever moves to a tree that passed the full proof:
#   1. Waits until `CI / required` has passed on the pull request's own head.
#   2. Merges every ready pull request, revert pull requests first and the rest
#      first-in first-out, up to 8, onto `origin/main` on `merge-queue/staging`
#      and dispatches `Build & Test` (full proof: `packaging=true`,
#      `rtdb-differential=true`, every non-slow app scenario, base quarantine).
#      A pull request that conflicts is removed with a comment and the rest of
#      the batch goes on. A batch that holds a revert holds only reverts.
#   3. Reruns failed staging jobs at most once to absorb single-attempt flakes.
#      A batch that fails again is split to find the culprit: half of the
#      suspects is staged, a half that passes lands, and the search goes on in
#      the half that failed, for at most 6 more runs at a batch of 8. Only a
#      pull request left alone with a twice-failed run is removed.
#   4. Once staging is green and `main` has not moved, pushes the staged commit
#      to `main` without force, so `main` becomes the commit that was tested,
#      checks that the tree on `main` is the tested tree, comments the commit
#      and the staging run on each pull request, dispatches `main`'s post-merge
#      workflows when running under the default workflow token, and stages the
#      next batch. A refused push changes nothing the first time; a second
#      refusal of the same commit removes the batch with a comment.
#   5. While `Build & Test` or `Slow app scenarios` is red on the head of
#      `main`, stages and lands revert pull requests only.
#
# Optional: set `secrets.MERGE_QUEUE_TOKEN` (fine-grained PAT with `contents`
# and `pull-requests` write on this repository) if you prefer landings to
# trigger native `on: push` events on `main` directly instead of
# `workflow_dispatch`.

name: Merge queue

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    # Build & Test finishing on staging moves the batch on; either workflow
    # finishing on main can release a queue held while main was red.
    workflows: ['Build & Test', 'Slow app scenarios']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the next queue action without mutating branches, labels, or pull requests'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  queue:
    name: Advance merge queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.label.name == 'merge-queue' ||
        contains(github.event.pull_request.labels.*.name, 'merge-queue')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          USING_WORKFLOW_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN == '' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: bun scripts/ci/merge-queue-github.ts
