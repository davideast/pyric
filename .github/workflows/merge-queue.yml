# FIFO + fastlane merge queue for personal repositories where GitHub's
# organization-only `merge_group` queue cannot be enabled.
#
# Apply the `merge-queue` label to an open pull request targeting `main` once it
# is approved to land. Serialized under a single concurrency group so two pull
# requests never merge into `main` back-to-back without testing the combined
# tree first:
#   1. Waits until `CI / required` has passed on the pull request's own head.
#   2. Merges the head pull request onto `origin/main` on `merge-queue/staging`
#      and dispatches `Build & Test` (full proof: `packaging=true`,
#      `rtdb-differential=true`, every non-slow app scenario, base quarantine).
#   3. Reruns failed staging jobs at most once to absorb single-attempt flakes;
#      dequeues with a diagnostic comment on merge conflict or confirmed failure.
#   4. Merges into `main` with `--match-head-commit` (`sha`) once staging is
#      green and `main` has not moved, dispatches `main`'s post-merge workflows
#      when running under the default workflow token, and immediately stages the
#      next queued pull request.
#
# Optional: set `secrets.MERGE_QUEUE_TOKEN` (fine-grained PAT with `contents`
# and `pull-requests` write on this repository) if you prefer merges to trigger
# native `on: push` events on `main` directly instead of `workflow_dispatch`.

name: Merge queue

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ['Build & Test']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the next queue action without mutating branches, labels, or pull requests'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  queue:
    name: Advance merge queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.label.name == 'merge-queue' ||
        contains(github.event.pull_request.labels.*.name, 'merge-queue')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          USING_WORKFLOW_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN == '' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: bun scripts/ci/merge-queue-github.ts
