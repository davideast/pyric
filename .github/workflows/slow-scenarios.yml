# The app scenarios that wait on real timeouts: each `test/apps/<name>` whose
# scenario.ts exports `slow = true`. Build & Test skips them on every run
# (`--skip-slow`); this workflow runs only them, on the same packed packages.
#
# It also runs the slow script tests (`bun run test:slow`, files named
# `*.slow.test.ts`), which wait on real timers and so are left out of the
# test:ci:libraries lists that gate pull requests.
#
# Runs on pushes to main, nightly, on demand, and on a pull request when the
# `ci-slow-scenarios` label is added (by someone with triage access). A push
# after the label does not run it again: remove and re-add the label, or
# re-run the workflow. It is not part of `CI / required`.
#
# The long-session soak (test/apps/long-session-soak) is slow too, so the
# slow-scenarios job runs it for SOAK_MINUTES=5. Its full hour runs in the
# soak job: nightly, and on demand when `soak_minutes` is given, which then
# runs only that job. A nightly run has a concurrency group of its own, so a
# push to main does not cancel the soak.

name: Slow app scenarios

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 9 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'One app under test/apps to run, slow or not. Empty runs every slow app.'
        required: false
        default: ''
      soak_minutes:
        description: 'Run only the long-session soak, for this many minutes (at most 75). Empty runs the slow apps instead.'
        required: false
        default: ''
      soak_seed:
        description: 'The soak seed, a number or a word, to replay a failure. Empty uses the scenario default.'
        required: false
        default: ''
      soak_heap_snapshots:
        description: 'Set to 1 to take two dev server heap snapshots before the first restart and save the kinds of object that grew.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One run per ref; a newer one cancels it. Adding any other label to a pull
  # request starts a run that does nothing, so it gets a group of its own
  # instead of cancelling a slow run in progress.
  group: slow-scenarios-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.label.name != 'ci-slow-scenarios' && format('-{0}', github.run_id) || '' }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

jobs:
  slow-script-tests:
    name: Slow script tests (real processes and timers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name != 'pull_request' || github.event.label.name == 'ci-slow-scenarios') && !inputs.soak_minutes
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Slow script tests
        run: bun run test:slow

  slow-scenarios:
    name: Slow app scenarios (real apps on the packed packages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || github.event.label.name == 'ci-slow-scenarios') && !inputs.soak_minutes
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'
      - name: Cache app npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyric-app-scenarios-npm
          key: app-scenarios-npm-${{ runner.os }}-${{ hashFiles('test/apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: app-scenarios-npm-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      # Restores the build Build & Test saved for these inputs, or builds the
      # packages (scripts/build.sh --packages-only) and saves them.
      - uses: ./.github/actions/restore-dist
        with:
          flavor: packages
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('packages/cli/package.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium browser
        run: bunx playwright install chromium
      - name: Pack the published packages
        run: bash scripts/pack-packages.sh --skip-build
      - name: Slow app scenarios
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          # The long-session soak's short form; the soak job runs its hour.
          SOAK_MINUTES: '5'
        run: |
          if [ -n "$SCENARIO" ]; then
            bun test/apps/run.ts --packages dist/packages "$SCENARIO"
          else
            bun test/apps/run.ts --packages dist/packages --only-slow
          fi
      - name: Upload app scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-app-scenarios-logs-${{ github.run_attempt }}
          path: test-results/apps/
          if-no-files-found: warn
          retention-days: 7

  soak:
    name: Long-session soak (an hour of seeded use of a real app)
    runs-on: ubuntu-latest
    # The scenario's own limit is SOAK_MINUTES + 10; this leaves room to set up.
    timeout-minutes: 95
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes)
    steps:
      - name: Check the soak length
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || '60' }}
        run: |
          if ! awk -v m="$SOAK_MINUTES" 'BEGIN { exit !(m + 0 > 0 && m + 0 <= 75) }'; then
            echo "soak_minutes must be a number from 1 to 75, not '$SOAK_MINUTES'"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'
      - name: Cache app npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyric-app-scenarios-npm
          key: app-scenarios-npm-${{ runner.os }}-${{ hashFiles('test/apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: app-scenarios-npm-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - uses: ./.github/actions/restore-dist
        with:
          flavor: packages
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('packages/cli/package.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium browser
        run: bunx playwright install chromium
      - name: Pack the published packages
        run: bash scripts/pack-packages.sh --skip-build
      - name: Long-session soak
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || '60' }}
          SOAK_SEED: ${{ inputs.soak_seed }}
          SOAK_HEAP_SNAPSHOTS: ${{ inputs.soak_heap_snapshots }}
        run: bun test/apps/run.ts --packages dist/packages long-session-soak
      # Always: a passing run's action log and memory samples are what the next failure is read against.
      - name: Upload the soak's logs, action log, and memory samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-session-soak-${{ github.run_attempt }}
          path: test-results/apps/long-session-soak/
          if-no-files-found: warn
          retention-days: 14
