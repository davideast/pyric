# Auto revert: when a push to main fails Build & Test or Slow app scenarios,
# open a pull request that reverts the merge that broke it
# (scripts/ci/auto-revert.ts decides, scripts/ci/auto-revert-github.ts acts).
#
# The head commit is the culprit only when the same workflow's push run on its
# first parent passed. A failed parent means main was already red, and a parent
# with no finished run leaves the culprit unknown; neither is reverted. Nor is
# a revert, nor a run whose failures include a quarantined test.
#
# Two stages, so a flake never reverts good work:
#   - attempt 1 failed: rerun only its failed jobs, once. The main failure
#     lane already reruns Build & Test, so this lane reruns only Slow app
#     scenarios, and only while the commit is still the head of main and no
#     newer push run is pending (a rerun joins that run's concurrency group).
#   - attempt 2, started by that rerun, failed again: push the revert
#     (`git revert -m 1 <merge>`) to auto-revert/<sha>, open a ready
#     `revert: <title>` pull request naming the failing run and jobs, start
#     Build & Test on the branch by dispatch (a pull request opened with the
#     workflow token starts no workflows; the dispatched run's `CI / required`
#     lands on the branch's head commit), and enable auto-merge. Nothing is
#     ever pushed to main. A branch or pull request that already exists, open
#     or closed, ends the job quietly; any other failure files or comments on
#     the `Red on main: Auto revert` issue.
#
# A rerun started with the workflow token still sends workflow_run, so the
# second stage starts from attempt 2's completion. A manual dispatch prints
# the verdict for a past run and attempt and changes nothing.

name: Auto revert

on:
  workflow_run:
    workflows: ['Build & Test', 'Slow app scenarios']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id to decide on (dry run; nothing is rerun or reverted)
        required: true
        type: string
      attempt:
        description: Attempt of that run
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: auto-revert-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  confirm:
    name: Rerun the failed jobs once
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Decide and rerun
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: '1'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/auto-revert-github.ts

  revert:
    name: Open the revert pull request
    # Only the attempt the one rerun started; a person's rerun is theirs.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 2 &&
      github.event.workflow_run.triggering_actor.login == 'github-actions[bot]'
    # Build & Test and Slow app scenarios can both fail on one commit; their
    # revert jobs run one at a time, and the second finds the first's work.
    concurrency:
      group: auto-revert-commit-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write starts Build & Test on the revert branch.
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Decide and revert
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: '2'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/auto-revert-github.ts

  report:
    name: Report a failed revert
    needs: revert
    if: always() && needs.revert.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: File or comment on the Red on main issue
        env:
          LANE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/auto-revert-github.ts report

  preview:
    name: Print the verdict for a past run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Decide without acting
        env:
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.attempt }}
          DRY_RUN: 'true'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/auto-revert-github.ts
