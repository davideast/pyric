# Evaluates SHA-pinned two-axis Advisor campaign review verdicts on open pull
# requests targeting `main` and adds the `merge-queue` label when both `spec`
# and `standards` carry a trusted `MERGE` verdict (`OWNER`, `MEMBER`, or
# `COLLABORATOR`) for the current head SHA with no subsequent `FIX` verdict.
#
# Never checks out or executes pull request code: `actions/checkout@v4` pins
# `ref: main` with `persist-credentials: false`, and all event inputs enter via
# `env:` rather than inline `${{ }}` shell interpolation.
# `.github/workflows/merge-queue.yml` waits for `CI / required` on the pull
# request head before staging or landing.

name: Campaign verdicts

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: campaign-verdicts-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate campaign verdicts
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'open' &&
       (contains(github.event.comment.body, 'campaign-verdict') ||
        contains(github.event.changes.body.from, 'campaign-verdict')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Evaluate campaign verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun scripts/ci/campaign-verdicts.ts
