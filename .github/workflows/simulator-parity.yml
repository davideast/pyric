# Simulator parity gate — two jobs:
#   1. simulator-tests — in-process Firestore Rules simulator suite on PRs
#      that touch the simulator or its grammar (no secrets needed).
#   2. parity-stress   — production-parity packs against the live Rules
#      Test API. Authenticates through Workload Identity Federation as a
#      service account holding only `firebaserules.rulesets.test`; no key is
#      stored. Runs when the GCP_WIF_PROVIDER repo variable is set; skips with
#      a warning when it is not, and on pull requests from forks, which cannot
#      mint an OIDC token. Once it runs, an auth failure fails the job.
#      packages/conformance/docs/how-to-run-the-conformance-system.md has the
#      one-time GCP setup.
#
# Post-mirror layout: simulator + grammar live under
# packages/pyric/src/{firestore/sandbox,rules/{grammar,simulator}}/.
# The suite itself is at packages/pyric/test/{sandbox/firestore/simulator,
# rules/simulator}/; the live parity packs at packages/pyric/test/rules/parity/.

name: Simulator Parity

on:
  pull_request:
    paths:
      - 'packages/pyric/src/firestore/sandbox/**'
      - 'packages/pyric/src/rules/grammar/**'
      - 'packages/pyric/src/rules/simulator/**'
      - 'packages/pyric/test/sandbox/firestore/simulator/**'
      - 'packages/pyric/test/rules/**'
      - '.github/workflows/simulator-parity.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pyric/src/firestore/sandbox/**'
      - 'packages/pyric/src/rules/grammar/**'
      - 'packages/pyric/src/rules/simulator/**'
      - 'packages/pyric/test/sandbox/firestore/simulator/**'
      - 'packages/pyric/test/rules/**'
      - '.github/workflows/simulator-parity.yml'
  workflow_dispatch:

concurrency:
  # A new push to the same branch or PR cancels the in-flight run.
  group: simulator-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: Unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build pyric
        run: bun run build:pyric
      - name: Run simulator tests
        run: |
          bun test packages/pyric/test/sandbox/firestore/simulator
          bun test packages/pyric/test/rules/simulator

  parity-stress:
    name: Parity stress (live Rules Test API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # id-token: write lets google-github-actions/auth exchange this job's
    # GitHub OIDC token for short-lived Google credentials.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      # Skips only when federation is not configured for this run: the
      # GCP_WIF_PROVIDER variable is unset, or the pull request comes from a
      # fork, whose token cannot request an OIDC token. A configuration that is
      # present but broken fails a later step instead of skipping.
      - name: Check Workload Identity Federation configuration
        id: wif-check
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PARITY_SA_EMAIL: ${{ vars.PARITY_SA_EMAIL }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Parity stress skipped: pull requests from forks cannot request a GitHub OIDC token."
          elif [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Parity stress skipped: the GCP_WIF_PROVIDER repository variable is not set. packages/conformance/docs/how-to-run-the-conformance-system.md has the Workload Identity Federation setup."
          elif [ -z "$PARITY_SA_EMAIL" ]; then
            echo "::error::GCP_WIF_PROVIDER is set but PARITY_SA_EMAIL is not. Set both repository variables."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Writes an external-account credentials file and exports
      # GOOGLE_APPLICATION_CREDENTIALS and GOOGLE_CLOUD_PROJECT. Fails the job
      # when the provider or the service account binding rejects the exchange.
      - name: Authenticate to Google Cloud
        if: steps.wif-check.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PARITY_SA_EMAIL }}
      # Bun re-downloads every dependency from the registry without this;
      # persisting its install cache lets `bun install` reuse prior downloads.
      - name: Cache Bun dependencies
        if: steps.wif-check.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        if: steps.wif-check.outputs.available == 'true'
        run: bun install --frozen-lockfile --filter pyric
      # PARITY_REQUIRE_CREDENTIAL=1 makes the packs fail, not skip, when no
      # credential resolves. A credential that cannot mint a token fails the
      # first scenario.
      - name: Run live parity packs
        if: steps.wif-check.outputs.available == 'true'
        env:
          PARITY_REQUIRE_CREDENTIAL: '1'
        run: bun test packages/pyric/test/rules/parity
