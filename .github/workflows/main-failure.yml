# Main failure lane: rerun a failed main run once, then file what happened.
#
# When a Build & Test run started by a push to main completes, this lane
# classifies it (scripts/ci/main-failure.ts):
#   - attempt 1 failed: rerun only its failed jobs, once, and wait for
#     attempt 2 in the same job, since a rerun started with the workflow
#     token does not start this workflow again. Build & Test on main cancels
#     an in-progress run when another starts, and a rerun joins that group,
#     so it reruns only while the commit is still the head of main and no
#     newer push run is pending. Otherwise the failures go to the one
#     "Unconfirmed failures on main: " issue;
#   - attempt 2 passed: each test that failed in attempt 1 (or its job, when
#     the log names no test) is a flake, filed as one lane:velocity issue
#     titled "Flaky on main: `<test>`", or commented on an open issue that
#     already names the test file's repository path (so a second flaky test
#     in the same file comments on that file's flake issue);
#   - attempt 2 failed: open or update the one "Main is red: " issue, naming
#     the commit, the failing jobs and tests, and both attempts;
#   - attempt 2 cancelled: attempt 1's failures go to the unconfirmed issue;
#   - any green run closes the red and unconfirmed issues with a comment
#     naming the run;
#   - nothing is rerun past attempt 1, so it cannot loop.
#
# A manual dispatch classifies a past run by id. With dry_run (the default) it
# prints what it would rerun and file for every attempt, and changes nothing.
# Without dry_run it refuses any run but a push run of Build & Test on main.
#
# The quarantine job comments on each quarantined test's tracking issue
# (scripts/ci/quarantine-release.ts): the test failed in this run without
# blocking it, it passed the last 20 main runs so its entry can go, or its
# quarantine expired and it blocks again. A dispatch with dry_run prints the
# comments instead.
#
# It never runs on pull requests and never gates one.

name: Main failure

on:
  workflow_run:
    workflows: ['Build & Test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build & Test run id to classify
        required: true
        type: string
      dry_run:
        description: Print the plan without rerunning or filing
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: main-failure-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: Rerun once and file
    # Only push runs on main. An attempt this lane reran itself is handled by
    # the job that reran it, so its completion is skipped here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.run_attempt == 1 ||
      github.event.workflow_run.triggering_actor.login != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Classify the run
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/main-failure.ts

  quarantine:
    name: Report quarantined tests
    # One group for every run, so two main runs never read the same issue's
    # comments at once and post the same comment twice. A pending run that a
    # newer one replaces loses nothing: each run looks back at the five
    # before it for failures not yet commented.
    concurrency:
      group: main-failure-quarantine
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.run_attempt == 1 ||
      github.event.workflow_run.triggering_actor.login != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Comment on quarantine issues
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci/quarantine-release.ts
