# Main-only production oracle capture workflow.
#
# Captures new or updated observations under packages/conformance/observations/**
# against the dedicated oracle project (digame-mas) and opens or updates a
# reviewable pull request on chore/oracle-capture-<rig>.
#
# Security isolation across two jobs and two WIF tiers:
#   1. capture - holds `contents: read` + `id-token: write` ONLY. Read-only
#      Rules Test API rigs authenticate through `GCP_WIF_PROVIDER` +
#      `PARITY_SA_EMAIL`; messaging and live-project write rigs authenticate
#      through the optional main-only `CAPTURE_WIF_PROVIDER` + `CAPTURE_SA_EMAIL`
#      identity (skipping cleanly when not yet configured so write roles are
#      never granted to the PR-reachable identity). Reverts `observedAt`-only
#      rewrites, fails closed on any path outside `observations/**`, and uploads
#      the validated observation bundle as a workflow artifact.
#   2. open-pr - holds `contents: write` + `pull-requests: write` ONLY (zero
#      GCP WIF credentials or Firebase secrets). Downloads the bundle,
#      re-verifies every file against symlinks, path traversal, and JSON schema
#      drift, commits onto chore/oracle-capture-<rig>, pushes, and opens or
#      updates the pull request (falling back to github.token + PAT synchronize
#      push when the PAT lacks createPullRequest permission).

name: Oracle capture

on:
  push:
    branches: [main]
    paths:
      - 'packages/conformance/probes/**'
      - 'packages/conformance/rules-corpus/**'
      - 'packages/conformance/rigs/**'
      - 'packages/conformance/src/*probe*.ts'
  workflow_dispatch:
    inputs:
      rig:
        description: 'Oracle rig id or comma-separated rig ids (e.g. rules-firestore, rules-storage, sdk-probes, android-sdk-probes, ios-sdk-probes, functions-callable, functions-http, admin-auth, messaging-send)'
        required: true
        type: string
      filter:
        description: 'Optional scenario or probe id passed as --scenario / --probe when dispatching a single rig'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-capture-${{ inputs.rig || 'push' }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture observations on main (${{ matrix.os }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      id-token: write
    outputs:
      has_captures: ${{ steps.latched.outputs.has_captures }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile --filter '!@pyric/playground'
      - name: Plan capture targets
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_RIG: ${{ inputs.rig }}
          INPUT_FILTER: ${{ inputs.filter }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PARITY_SA_EMAIL: ${{ vars.PARITY_SA_EMAIL }}
          CAPTURE_WIF_PROVIDER: ${{ vars.CAPTURE_WIF_PROVIDER }}
          CAPTURE_SA_EMAIL: ${{ vars.CAPTURE_SA_EMAIL }}
          CAPTURE_RUNNER_OS: ${{ matrix.os }}
          PLAN_FILE: ${{ runner.temp }}/oracle-capture-plan.json
        run: bun scripts/ci/oracle-capture-pr.ts plan
      - name: Authenticate read-only Rules Test API identity
        id: auth-parity
        if: steps.plan.outputs.should_run == 'true' && steps.plan.outputs.needs_parity_wif == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PARITY_SA_EMAIL }}
      - name: Authenticate main-only capture identity
        id: auth-capture
        if: steps.plan.outputs.should_run == 'true' && steps.plan.outputs.needs_capture_wif == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CAPTURE_WIF_PROVIDER }}
          service_account: ${{ vars.CAPTURE_SA_EMAIL }}
      - name: Cache Gradle dependencies for Android Robolectric oracle rig
        if: runner.os == 'Linux' && steps.plan.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-oracle-gradle-${{ hashFiles('packages/conformance/rigs/native-android-oracle/gradle.properties', 'packages/conformance/rigs/native-android-oracle/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-oracle-gradle-
      - name: Build rules engine
        if: steps.plan.outputs.should_run == 'true'
        run: bun run build:rules
      - name: Build pyric runtime for oracle-run
        if: steps.plan.outputs.should_run == 'true'
        run: bun run --cwd packages/pyric build
      - name: Cache iOS SwiftPM oracle packages
        if: runner.os == 'macOS' && steps.plan.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyric-ios-oracle-spm
          key: ${{ runner.os }}-ios-oracle-spm-${{ hashFiles('packages/conformance/rigs/native-ios-oracle/**/Package.swift', 'packages/conformance/rigs/native-ios-oracle/sdk-version.properties') }}
          restore-keys: |
            ${{ runner.os }}-ios-oracle-spm-
      - name: Cache Playwright Chromium browser
        if: runner.os == 'Linux' && steps.plan.outputs.should_run == 'true' && steps.plan.outputs.needs_chromium == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/conformance/package.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium for browser capture rigs
        if: runner.os == 'Linux' && steps.plan.outputs.should_run == 'true' && steps.plan.outputs.needs_chromium == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Run capture and validate observation diffs
        id: capture
        if: steps.plan.outputs.should_run == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PLAN_FILE: ${{ runner.temp }}/oracle-capture-plan.json
          ARTIFACT_DIR: ${{ runner.temp }}/oracle-capture-bundle
          PYRIC_ORACLE_PROJECT_ID: digame-mas
          PARITY_PROJECT_ID: digame-mas
          PARITY_REQUIRE_CREDENTIAL: '1'
          PARITY_SA_EMAIL: ${{ vars.PARITY_SA_EMAIL }}
          CAPTURE_SA_EMAIL: ${{ vars.CAPTURE_SA_EMAIL }}
          PARITY_WIF_CREDENTIALS_FILE: ${{ steps.auth-parity.outputs.credentials_file_path }}
          CAPTURE_WIF_CREDENTIALS_FILE: ${{ steps.auth-capture.outputs.credentials_file_path }}
          PYRIC_ORACLE_FIREBASE_CONFIG: ${{ secrets.PYRIC_ORACLE_FIREBASE_CONFIG }}
          PYRIC_ORACLE_RTDB_URL: ${{ vars.PYRIC_ORACLE_RTDB_URL || secrets.PYRIC_ORACLE_RTDB_URL }}
        run: bun scripts/ci/oracle-capture-pr.ts capture
      - name: Latch capture flag across matrix legs
        id: latched
        if: steps.capture.outputs.has_captures == 'true'
        run: echo "has_captures=true" >> "$GITHUB_OUTPUT"
      - name: Upload validated observations bundle
        if: always() && steps.capture.outputs.has_captures == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-capture-observations-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-capture-bundle
          retention-days: 7
          if-no-files-found: error

  open-pr:
    name: Open or update capture pull request
    needs: [capture]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.capture.result != 'cancelled' &&
      (needs.capture.outputs.has_captures == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.MERQUE_QUEUE_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Download validated observations bundle
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-capture-observations-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-capture-bundle
      - name: Verify bundle, push branch, and open or update PR
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.MERQUE_QUEUE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.MERQUE_QUEUE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="${{ runner.temp }}/oracle-capture-bundle"
          if [ -f "$BUNDLE_ROOT/manifest.json" ]; then
            ARTIFACT_DIR="$BUNDLE_ROOT" bun scripts/ci/oracle-capture-pr.ts open-pr
          else
            found=0
            for bundle_dir in "$BUNDLE_ROOT"/*; do
              [ -f "$bundle_dir/manifest.json" ] || continue
              found=1
              echo "Processing capture artifact bundle: $bundle_dir"
              ARTIFACT_DIR="$bundle_dir" bun scripts/ci/oracle-capture-pr.ts open-pr
            done
            if [ "$found" -eq 0 ]; then
              echo "No capture artifact bundles found under $BUNDLE_ROOT; nothing to open."
            fi
          fi

  reconcile-diverted-prs:
    name: Auto-close superseded diverted capture PRs
    needs: [capture, open-pr]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.capture.result != 'cancelled' &&
      needs['open-pr'].result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.MERQUE_QUEUE_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Close superseded diverted capture PRs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.MERQUE_QUEUE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/oracle-capture-pr.ts reconcile-diverted
