name: Restore or build workspace dist
description: >
  Content-keyed cache of the workspace build. When the build inputs
  (scripts/ci/build-input-key.sh) are unchanged, restores dist/ and the
  gitignored generated sources instead of rebuilding; otherwise runs the build
  and saves the result immediately, before any test can mutate it. Exact-match
  only — no restore-keys, because a near-miss restore would run tests against
  stale artifacts (fail-closed, same posture as scripts/ci/required.ts).
inputs:
  flavor:
    description: >
      "packages" for `scripts/build.sh --packages-only`; "studio" for the
      full `scripts/build.sh`, which embeds the Studio site in @pyric/cli as
      the published tarball ships it; "site" for the full build plus the
      composed public site (scripts/build-site.sh).
    required: true
  fresh:
    description: >
      "true" skips the restore and always builds; the result is still saved.
      Only the studio flavor reads it.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Compute build-input keys
      id: key
      shell: bash
      run: bash scripts/ci/build-input-key.sh >> "$GITHUB_OUTPUT"

    - name: Restore built packages
      if: inputs.flavor == 'packages'
      id: restore-packages
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
        key: dist-packages-${{ runner.os }}-${{ steps.key.outputs.packages-key }}

    - name: Restore built packages and site
      if: inputs.flavor == 'site'
      id: restore-site
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
          dist/site
        key: dist-site-${{ runner.os }}-${{ steps.key.outputs.site-key }}

    - name: Key the Studio build on the pinned toolchain
      if: inputs.flavor == 'studio'
      id: toolchain
      shell: bash
      env:
        BUN_VERSION: ${{ env.BUN_VERSION }}
        NODE_VERSION: ${{ env.NODE_VERSION }}
      run: |
        # build.yml's workflow env pins both; a key without them could restore
        # output another toolchain built, so a missing pin fails the job.
        if [ -z "$BUN_VERSION" ] || [ -z "$NODE_VERSION" ]; then
          echo "restore-dist: the studio flavor needs BUN_VERSION and NODE_VERSION in the workflow env" >&2
          exit 1
        fi
        echo "toolchain=bun-$BUN_VERSION-node-$NODE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Restore built packages with the embedded Studio site
      if: inputs.flavor == 'studio' && inputs.fresh != 'true'
      id: restore-studio
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
        # The site key covers every input of the full build and more, so it
        # is exact for this flavor too; the prefix keeps the two apart.
        key: dist-studio-${{ runner.os }}-${{ steps.toolchain.outputs.toolchain }}-${{ steps.key.outputs.site-key }}

    - name: Build packages (site omitted)
      if: inputs.flavor == 'packages' && steps.restore-packages.outputs.cache-hit != 'true'
      shell: bash
      run: bash scripts/build.sh --packages-only

    - name: Build packages and the embedded Studio site
      if: inputs.flavor == 'studio' && steps.restore-studio.outputs.cache-hit != 'true'
      shell: bash
      run: bash scripts/build.sh

    - name: Build packages and compose the public site
      if: inputs.flavor == 'site' && steps.restore-site.outputs.cache-hit != 'true'
      shell: bash
      run: bash scripts/build.sh && bash scripts/build-site.sh

    - name: Save built packages
      if: inputs.flavor == 'packages' && steps.restore-packages.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
        key: dist-packages-${{ runner.os }}-${{ steps.key.outputs.packages-key }}

    - name: Save built packages with the embedded Studio site
      if: inputs.flavor == 'studio' && steps.restore-studio.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
        key: dist-studio-${{ runner.os }}-${{ steps.toolchain.outputs.toolchain }}-${{ steps.key.outputs.site-key }}

    - name: Save built packages and site
      if: inputs.flavor == 'site' && steps.restore-site.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          packages/*/dist
          packages/cli/src/assurance/.generated
          packages/cli/src/conformance/.generated
          packages/cli/src/cli/service-commands.generated.ts
          packages/cli/src/bridge/tool-families.generated.ts
          packages/cli/src/bridge/surface/manifest.generated.ts
          packages/cli/src/bridge/surface/manifest.sandbox.generated.ts
          packages/cli/src/bridge/surface/descriptions.generated.ts
          dist/site
        key: dist-site-${{ runner.os }}-${{ steps.key.outputs.site-key }}
