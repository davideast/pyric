<!doctype html>
<title>remote page</title>
<script type="module">
  import { initializeApp } from 'firebase/app';
  import { doc, getDoc, getFirestore } from 'firebase/firestore';

  const app = initializeApp({ projectId: 'demo-state-loopback', apiKey: 'demo', appId: 'demo' });
  try {
    const snapshot = await getDoc(doc(getFirestore(app), 'private/doc'));
    window.outcome = `read: ${JSON.stringify(snapshot.data() ?? null)}`;
  } catch (error) {
    window.outcome = `refused: ${error.message}`;
  }
</script>
