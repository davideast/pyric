name: flutter_todo_app
description: "Pyric Flutter Example Todo App with Auth, Firestore, and Debug Overlay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  pyric_firestore:
    path: ../../packages/flutter-client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
