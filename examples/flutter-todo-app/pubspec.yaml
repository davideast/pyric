name: flutter_todo_app
description: "Pyric Flutter Example Todo App with Auth, Firestore, and Debug Overlay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  pyric_firestore:
    path: ../../packages/flutter-client
  cloud_firestore_platform_interface: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.1

flutter:
  uses-material-design: true
