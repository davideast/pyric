<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management Workspace (Pyric In-Page Sandbox)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .transition-all-fast { transition: all 0.15s ease-in-out; }
    input[type="checkbox"] { display: none; }
    .custom-checkbox {
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 0.25rem;
      border: 1px solid #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      background: transparent;
      color: transparent;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-50 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8 antialiased select-none">
  <div id="root" class="w-full max-w-3xl flex flex-col items-center"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
