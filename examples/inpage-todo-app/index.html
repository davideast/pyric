<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App (Pyric Firestore, Storage & Auth In-Page Sandbox)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --app-background: #ffffff;
      --app-foreground: #09090b;
      --app-card: #ffffff;
      --app-border: #e4e4e7;
      --app-muted: #f4f4f5;
      --app-muted-foreground: #71717a;
    }
    .transition-all-fast {
      transition: all 0.15s ease-in-out;
    }
    input[type="checkbox"] {
      display: none;
    }
    .custom-checkbox {
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 0.25rem;
      border: 1px solid var(--app-border, #e4e4e7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      background: transparent;
      color: transparent;
    }
    .checked-checkbox {
      background-color: var(--app-foreground, #09090b);
      border-color: var(--app-foreground, #09090b);
      color: var(--app-background, #ffffff);
    }
  </style>
</head>
<body class="bg-[var(--app-background)] text-[var(--app-foreground)] font-sans antialiased min-h-screen p-4 sm:p-8 flex justify-center selection:bg-[var(--app-muted)] selection:text-[var(--app-foreground)]">
  <div id="root" class="max-w-2xl w-full flex flex-col gap-8 sm:gap-10 my-auto"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
