<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vite-sandbox-app</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
      button { padding: 0.4rem 0.9rem; cursor: pointer; }
      form { display: flex; gap: 0.5rem; margin: 1rem 0; }
      /* `form { display: flex }` above beats the UA `[hidden] { display: none }`,
         so without this the form stays visible while signed out. */
      [hidden] { display: none !important; }
      input { flex: 1; padding: 0.4rem 0.6rem; }
      ul { padding-left: 1.2rem; }
      .status { color: #666; display: flex; align-items: center; gap: 0.5rem; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; }
    </style>
  </head>
  <body>
    <main>
      <h1>vite-sandbox-app</h1>
      <p class="status">
        <img class="avatar" id="avatar" alt="" hidden />
        <span id="auth-status">Signed out</span>
      </p>
      <button id="sign-in">Sign in with Google</button>
      <button id="sign-out" hidden>Sign out</button>
      <!-- Visible even while signed out ON PURPOSE — submitting attempts the
           write and the per-user rules deny it (see main.ts). -->
      <form id="add-post">
        <input id="post-title" placeholder="Post title" required />
        <button type="submit">Add post</button>
      </form>
      <ul id="posts"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
